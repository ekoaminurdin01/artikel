<style>

    --kertas-2: #e1e6e3;
    --tinta: #16232b;
    --tinta-lembut: #4a5a62;

    --font-teks: "Literata", Georgia, "Times New Roman", serif;
    --lebar: 46rem;

    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --kertas: #12191d;
      --kertas-2: #1a2429;
      --tinta: #e6ecea;
      --tinta-lembut: #9dadb3;
      --garis: #33434a;

    --kertas-2: #1a2429;
    --tinta: #e6ecea;
    --tinta-lembut: #9dadb3;

  a:hover { color: var(--aksen); text-decoration-color: currentColor; }

  .judul-situs a:hover { color: var(--tinta); }
  .moto {

  .kategori-daftar strong {

  .isi { max-width: 40rem; font-size: 1.1875rem; line-height: 1.8; }
  .isi p + p { margin-top: 1.25em; }

  .isi .iklan { margin: 2.25rem 0; }
  .penutup { margin-top: 2rem; font-style: italic; color: var(--tinta-lembut); }

  .sebelum-sesudah small { display: block; color: var(--tinta-lembut); font-size: 0.88rem; margin-bottom: 0.25rem; }

  .sebelum-sesudah .kosong { color: var(--tinta-lembut); font-size: 0.9rem; }

  .terkait { margin-top: 2.5rem; }
  .terkait h2 { font-family: var(--font-judul); font-weight: 400; font-size: 1.7rem; margin-bottom: 0.5rem; }
  .terkait li { border-bottom: 1px solid var(--garis); }
  .terkait a { display: flex; justify-content: space-between; gap: 1rem; padding: 0.85rem 0; text-decoration: none; }
  .terkait a:hover span:first-child { color: var(--aksen); text-decoration: underline; }
  .terkait .meta { white-space: nowrap; }

  .kosong-teks { padding: 2rem 0; color: var(--tinta-lembut); font-style: italic; }

  /* Halaman teks */
  .prosa { max-width: 40rem; }
  .prosa h2 { font-family: var(--font-judul); font-weight: 400; font-size: 1.6rem; margin: 2rem 0 0.4rem; }

  .prosa ul { list-style: disc; padding-left: 1.3rem; }

  .kaki { border-top: 4px double var(--tinta); margin-top: 2rem; padding: 1.75rem 0 2.5rem; text-align: center; font-size: 0.95rem; }

  .kaki li + li { border-left: 1px solid var(--garis); }
  .kaki a { display: block; padding: 0.3rem 1rem; text-decoration: none; }
  .kaki a:hover { text-decoration: underline; }
  .kaki p { margin-top: 1rem; color: var(--tinta-lembut); font-size: 0.85rem; }

  .cari-baris { border-bottom: 1px solid var(--garis); }
  .cari { display: flex; gap: 0.5rem; padding: 0.7rem 0; max-width: 26rem; margin-left: auto; }

  .cari input::placeholder { color: var(--tinta-lembut); }
  .cari button {
    font: inherit; font-size: 0.92rem; color: var(--tinta); background: transparent;

  .cari button:hover { background: var(--tinta); color: var(--kertas); }
  .hasil-info { color: var(--tinta-lembut); margin: 1rem 0 0.25rem; }

  .langganan { margin: 3rem 0 0; padding: 1.75rem 0; border-top: 4px double var(--tinta); border-bottom: 1px solid var(--garis); }
  .langganan h2 { font-family: var(--font-judul); font-weight: 400; font-size: clamp(1.7rem, 4.5vw, 2.2rem); line-height: 1.15; }
  .langganan p { color: var(--tinta-lembut); margin: 0.5rem 0 1rem; max-width: 50ch; }
  .langganan-form { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .langganan-form input[type="email"] {
    flex: 1 1 14rem; min-width: 0; font: inherit; font-size: 1rem; color: var(--tinta);

  .langganan-form button {
    font: inherit; font-size: 1rem; color: var(--kertas); background: var(--tinta);
    border: 1.5px solid var(--tinta); border-radius: 2px; padding: 0.65rem 1.4rem; cursor: pointer;

  .langganan-form button:hover { background: var(--aksen); border-color: var(--aksen); }
  .langganan-status { min-height: 1.5em; margin: 0.75rem 0 0 !important; font-size: 0.92rem; color: var(--tinta) !important; }

  @media (max-width: 30rem) {
    .cari { max-width: none; }
    .menu ul { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; padding-inline: 0.75rem; }
    .menu a { white-space: nowrap; }
    .terkait a { flex-direction: column; gap: 0; }

    /* Motto ditumpuk agar garis pemisah tidak tertinggal di awal baris */
    .moto { flex-direction: column; gap: 0.15rem; }
    .moto span { padding: 0; }
    .moto span + span { border-left: 0; }

    /* Footer ditumpuk dengan area sentuh lebih lega */
    .kaki ul { flex-direction: column; align-items: center; }
    .kaki li + li { border-left: 0; }
    .kaki a { padding: 0.7rem 1rem; }
  }
</style>
</head>

  /* ---------------------------------------------------------------
     Bantuan kecil
     --------------------------------------------------------------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function kat(id) {
    for (var i = 0; i < KATEGORI.length; i++) if (KATEGORI[i].id === id) return KATEGORI[i];
    return null;
  }
  function tgl(iso) {
    var d = new Date(iso + "T00:00:00Z");
    try {
      return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
    } catch (e) { return iso; }
  }
  function menit(a) {
    var kata = a.isi.join(" ").split(/\s+/).length;
    return Math.max(1, Math.round(kata / 200)) + " menit baca";
  }
  function cari(slug) {
    for (var i = 0; i < ARTIKEL.length; i++) if (ARTIKEL[i].slug === slug) return i;
    return -1;
  }
  function jumlahKategori(id) {
    return ARTIKEL.filter(function (a) { return a.kategori === id; }).length;
  }

  /* Ruang iklan. Untuk memasang AdSense, tempel kode unit iklan Anda
     di dalam .iklan-slot dan hapus teks placeholder. */
  function iklan() {
    return '<aside class="iklan" aria-label="Iklan">' +
      '<span class="iklan-label">Iklan</span>' +
      '<div class="iklan-slot"><!-- Tempel kode unit iklan AdSense di sini -->Ruang iklan</div>' +
      '</aside>';
  }

  function langganan() {
    var aksi = LANGGANAN_URL ? ' action="' + esc(LANGGANAN_URL) + '" method="post" target="_blank"' : '';
    return '<section class="langganan" aria-labelledby="judul-langganan">' +
      '<h2 id="judul-langganan">Tulisan baru langsung ke surelmu</h2>' +
      '<p>Satu surel setiap ada tulisan baru. Kamu bisa berhenti kapan saja.</p>' +
      '<form class="langganan-form"' + aksi + '>' +
        '<label class="sr-only" for="surel-langganan">Alamat surel</label>' +
        '<input id="surel-langganan" type="email" name="' + esc(LANGGANAN_KOLOM) + '" placeholder="nama@contoh.com" autocomplete="email" required>' +
        '<button type="submit">Berlangganan</button>' +
      '</form>' +
      '<p class="langganan-status" role="status" aria-live="polite"></p>' +
      '</section>';
  }

  /* ---------------------------------------------------------------
     Tampilan
     --------------------------------------------------------------- */
  function entri(a) {
    var k = kat(a.kategori);
    return '<article class="entri">' +
      '<a class="kat-tautan" href="#/kategori/' + k.id + '">' + esc(k.nama) + '</a>' +
      '<h3><a href="#/artikel/' + a.slug + '">' + esc(a.judul) + '</a></h3>' +
      '<p class="ringkas">' + esc(a.ringkas) + '</p>' +
      '<p class="meta"><span>' + tgl(a.tanggal) + '</span>' +
        '<span><a class="baca-lanjut" href="#/artikel/' + a.slug + '" aria-label="Baca selengkapnya: ' + esc(a.judul) + '">Baca Selengkapnya</a></span></p>' +
      '</article>';
  }

  function pilihKategori() {
    var html = '<section aria-labelledby="pilih-kat">' +
      '<h2 class="judul-bagian" id="pilih-kat">Pilih tulisan berdasarkan kategori</h2>' +
      '<ul class="kategori-daftar">';
    KATEGORI.forEach(function (k) {
      var n = jumlahKategori(k.id);
      html += '<li><a href="#/kategori/' + k.id + '"><strong>' + esc(k.nama) + '</strong>' +
        '<small>' + esc(k.desk) + ' ' + n + ' tulisan.</small></a></li>';
    });
    return html + '</ul></section>';
  }

  function tampilBeranda() {
    var html = '<h1 class="sr-only">' + NAMA_SITUS + '</h1>' +
      '<section aria-labelledby="terbaru">' +
      '<h2 class="judul-bagian" id="terbaru">Artikel Terbaru</h2>';
    ARTIKEL.slice(0, 3).forEach(function (a) { html += entri(a); });
    if (ARTIKEL.length === 0) {
      html += '<p class="kosong-teks">Belum ada tulisan yang terbit. Silakan kembali lagi nanti.</p></section>' + langganan();
      return { html: html, judul: NAMA_SITUS, menu: "beranda" };
    }
    html += '<div class="tombol-baris"><a class="tombol" href="#/semua">Baca selengkapnya</a></div>' +
      '</section>' + iklan() + pilihKategori() + langganan();
    return { html: html, judul: NAMA_SITUS, menu: "beranda" };
  }

  function tampilCari(q) {
    q = (q || "").trim();
    var kunci = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hasil = kunci.length ? ARTIKEL.filter(function (a) {
      var teks = (a.judul + " " + a.ringkas + " " + a.isi.join(" ") + " " + kat(a.kategori).nama).toLowerCase();
      return kunci.every(function (k) { return teks.indexOf(k) > -1; });
    }) : [];

    var html = '<h1 class="judul-bagian">Hasil pencarian</h1>';
    if (!kunci.length) {
      html += '<p class="kosong-teks">Ketik kata kunci di kolom pencarian, misalnya "akal" atau "penderitaan".</p>';
    } else if (hasil.length === 0) {
      html += '<p class="kosong-teks">Tidak ada tulisan yang memuat "' + esc(q) + '". Coba kata yang lebih umum, atau pilih kategori di menu.</p>';
    } else {
      html += '<p class="hasil-info">' + hasil.length + ' tulisan memuat "' + esc(q) + '".</p>';
      hasil.forEach(function (a) { html += entri(a); });
    }
    return { html: html, judul: "Cari: " + q + " | " + NAMA_SITUS, menu: "", kueri: q };
  }

  function tampilSemua() {
    var html = '<h1 class="judul-bagian">Semua Tulisan</h1>';
    if (ARTIKEL.length === 0) html += '<p class="kosong-teks">Belum ada tulisan yang terbit.</p>';
    ARTIKEL.forEach(function (a) { html += entri(a); });
    html += iklan() + pilihKategori();
    return { html: html, judul: "Semua Tulisan", menu: "" };
  }

  function tampilKategori(id) {
    var k = kat(id);
    if (!k) return tampilBeranda();
    var daftar = ARTIKEL.filter(function (a) { return a.kategori === id; });
    var html = '<h1 class="judul-bagian">' + esc(k.nama) + '</h1>' +
      '<p class="pengantar">' + esc(k.desk) + '</p>';
    if (daftar.length === 0) {
      html += '<p class="kosong-teks">Belum ada tulisan di kategori ini. Coba lihat kategori lain di menu atas.</p>';
    } else {
      daftar.forEach(function (a) { html += entri(a); });
    }
    return { html: html, judul: k.nama, menu: id };
  }

  function tampilArtikel(slug) {
    var i = cari(slug);
    if (i < 0) return tampilBeranda();
    var a = ARTIKEL[i];
    var k = kat(a.kategori);

    var paragraf = "";
    var posisiIklan = a.isi.length > 2 ? 2 : a.isi.length;
    a.isi.forEach(function (p, n) {
      if (n === posisiIklan) paragraf += iklan();
      paragraf += "<p>" + esc(p) + "</p>";
    });
    if (posisiIklan === a.isi.length) paragraf += iklan();

    var lebih = ARTIKEL[i + 1];   /* lebih lama */
    var baru = ARTIKEL[i - 1];    /* lebih baru */

    var nav = '<nav class="sebelum-sesudah" aria-label="Navigasi artikel">';
    nav += lebih
      ? '<a class="kiri" href="#/artikel/' + lebih.slug + '" rel="prev"><small>Artikel sebelumnya &larr;</small><span class="jdl">' + esc(lebih.judul) + '</span></a>'
      : '<span class="kosong kiri">Ini tulisan paling awal.</span>';
    nav += baru
      ? '<a class="kanan" href="#/artikel/' + baru.slug + '" rel="next"><small>&rarr; Artikel berikutnya</small><span class="jdl">' + esc(baru.judul) + '</span></a>'
      : '<span class="kosong kanan">Ini tulisan terbaru.</span>';
    nav += '</nav>';

    var terkait = ARTIKEL.filter(function (x) { return x.slug !== a.slug; })
      .sort(function (x, y) {
        var sx = x.kategori === a.kategori ? 0 : 1;
        var sy = y.kategori === a.kategori ? 0 : 1;
        return sx - sy;
      }).slice(0, 3);
    var tk = '<section class="terkait" aria-labelledby="terkait"><h2 id="terkait">Artikel terkait</h2><ul>';
    terkait.forEach(function (x) {
      tk += '<li><a href="#/artikel/' + x.slug + '"><span>' + esc(x.judul) + '</span>' +
        '<span class="meta">' + esc(kat(x.kategori).nama) + '</span></a></li>';
    });
    tk += '</ul></section>';

    var html = '<article>' +
      '<header class="artikel-kepala">' +
        '<a class="kat-tautan" href="#/kategori/' + k.id + '">' + esc(k.nama) + '</a>' +
        '<h1>' + esc(a.judul) + '</h1>' +
        '<p class="oleh"><span class="meta">' + NAMA_SITUS + ' oleh </span><strong>' + esc(PENULIS) + '</strong></p>' +
        '<p class="meta"><span>' + tgl(a.tanggal) + '</span><span>' + menit(a) + '</span></p>' +
      '</header>' +
      '<div class="isi">' + paragraf + '</div>' +
      '</article>' + nav + tk + langganan();
    return { html: html, judul: a.judul + " | " + NAMA_SITUS, menu: k.id };
  }

  function tampilTentang() {
    return { judul: "Tentang HCK", menu: "", html:
      '<div class="prosa"><h1 class="judul-bagian">Tentang HCK</h1>' +
      '<p>Hanya Catatan Kecil (HCK) adalah ruang untuk menulis pelan-pelan tentang hal-hal besar: filsafat, hubungan agama dan akal, politik, ekonomi, dan kisah manusia sehari-hari.</p>' +
      '<p>Tulisan di sini tidak berusaha memberi kata akhir. Tujuannya sederhana, yaitu mengajak pembaca berpikir kritis, memeriksa alasan di balik keyakinan, dan tetap ramah kepada orang yang berpendapat lain.</p>' +
      '<p>Semua tulisan ditulis oleh ' + esc(PENULIS) + '.</p></div>' };
  }

  function tampilPrivasi() {
    return { judul: "Kebijakan Privasi", menu: "", html:
      '<div class="prosa"><h1 class="judul-bagian">Kebijakan Privasi</h1>' +
      '<p>Halaman ini menjelaskan bagaimana Hanya Catatan Kecil memperlakukan informasi pengunjung.</p>' +
      '<h2>Informasi yang dikumpulkan</h2>' +
      '<p>Situs ini tidak meminta Anda membuat akun atau mengisi data pribadi untuk membaca. Server dan layanan analitik dapat mencatat data teknis umum, seperti jenis peramban, halaman yang dibuka, dan waktu kunjungan.</p>' +
      '<h2>Cookie dan iklan</h2>' +
      '<p>Situs ini dapat menampilkan iklan dari Google AdSense. Google dan mitranya dapat memakai cookie untuk menayangkan iklan berdasarkan kunjungan Anda ke situs ini dan situs lain. Anda dapat mengatur atau menonaktifkan iklan yang dipersonalisasi melalui pengaturan iklan Google, dan mengatur cookie melalui peramban Anda.</p>' +
      '<h2>Tautan ke situs lain</h2>' +
      '<p>Tulisan dapat memuat tautan ke situs lain. HCK tidak bertanggung jawab atas kebijakan privasi maupun isi situs tersebut.</p>' +
      '<h2>Perubahan kebijakan</h2>' +
      '<p>Kebijakan ini dapat diperbarui sewaktu-waktu. Perubahan akan ditampilkan di halaman ini.</p>' +
      '<h2>Kontak</h2>' +
      '<p>Pertanyaan tentang privasi dapat dikirim ke alamat surel pengelola: [isi alamat surel Anda di sini].</p>' +
      '<p class="catatan-draf">Ini naskah awal untuk dilengkapi. Sesuaikan dengan layanan yang benar-benar Anda pakai, dan pertimbangkan meminta nasihat hukum sebelum situs diterbitkan.</p></div>' };
  }

  function tampilDisclaimer() {
    return { judul: "Disclaimer", menu: "", html:
      '<div class="prosa"><h1 class="judul-bagian">Disclaimer</h1>' +
      '<p>Tulisan di Hanya Catatan Kecil adalah pandangan pribadi penulis dan dimaksudkan sebagai bahan renungan serta diskusi.</p>' +
      '<ul>' +
      '<li>Isi situs bukan nasihat hukum, keuangan, medis, atau keagamaan yang mengikat.</li>' +
      '<li>Penulis berusaha akurat, tetapi tidak menjamin bahwa semua informasi selalu lengkap atau terbaru.</li>' +
      '<li>Iklan yang tampil disediakan pihak ketiga dan tidak selalu mencerminkan pandangan penulis.</li>' +
      '<li>Tanggapan dan kritik yang santun selalu diterima. Jika ada kekeliruan, penulis akan memperbaikinya.</li>' +
      '</ul></div>' };
  }

  /* ---------------------------------------------------------------
     Menu dan routing
     --------------------------------------------------------------- */
  var MENU = [{ id: "beranda", nama: "Beranda", href: "#/" }].concat(
    KATEGORI.map(function (k) { return { id: k.id, nama: k.nama, href: "#/kategori/" + k.id }; })
  );

  function gambarMenu(aktif) {
    var el = document.getElementById("menu-utama");
    el.innerHTML = MENU.map(function (m) {
      return '<li><a href="' + m.href + '"' + (m.id === aktif ? ' aria-current="page"' : '') + '>' + esc(m.nama) + '</a></li>';
    }).join("");
  }

  /* ---------------------------------------------------------------
     Firebase. Bila firebase-config.js sudah diisi, tulisan diambil dari
     Firestore (koleksi "artikel", hanya yang berstatus "terbit") dan
     menggantikan contoh bawaan di atas. Bila kosong atau gagal dimuat,
     situs tetap tampil dengan contoh bawaan.
     --------------------------------------------------------------- */
  var memuat = !!(window.HCK_FIREBASE && window.HCK_FIREBASE.apiKey);

  function muatDariFirebase() {
    if (!memuat) return;
    var V = "https://www.gstatic.com/firebasejs/10.12.2/";
    Promise.all([import(V + "firebase-app.js"), import(V + "firebase-firestore.js")])
      .then(function (m) {
        var db = m[1].getFirestore(m[0].initializeApp(window.HCK_FIREBASE));
        return m[1].getDocs(m[1].query(m[1].collection(db, "artikel"), m[1].where("status", "==", "terbit")));
      })
      .then(function (snap) {
        var daftar = [];
        snap.forEach(function (d) {
          var x = d.data();
          if (!kat(x.kategori) || !Array.isArray(x.isi)) return;
          daftar.push({ slug: d.id, judul: x.judul || "", kategori: x.kategori, tanggal: x.tanggal || "", ringkas: x.ringkas || "", isi: x.isi });
        });
        daftar.sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : 0; });
        ARTIKEL.length = 0;
        daftar.forEach(function (a) { ARTIKEL.push(a); });
      })
      .catch(function (e) { console.warn("Firebase gagal dimuat, memakai contoh bawaan.", e); })
      .then(function () { memuat = false; rute(); });
  }

  var pertama = true;
  function rute() {
    if (memuat) {
      gambarMenu("");
      document.getElementById("isi-halaman").innerHTML = '<p class="kosong-teks">Memuat tulisan…</p>';
      return;
    }
    var h = (location.hash || "#/").replace(/^#\/?/, "");
    var bagian = h.split("/");
    var hasil;
    switch (bagian[0]) {
      case "artikel": hasil = tampilArtikel(bagian[1]); break;
      case "kategori": hasil = tampilKategori(bagian[1]); break;
      case "semua": hasil = tampilSemua(); break;
      case "cari":
        var kueri = "";
        try { kueri = decodeURIComponent(bagian.slice(1).join("/")); } catch (e) { kueri = bagian.slice(1).join("/"); }
        hasil = tampilCari(kueri);
        break;
      case "tentang": hasil = tampilTentang(); break;
      case "privasi": hasil = tampilPrivasi(); break;
      case "disclaimer": hasil = tampilDisclaimer(); break;
      default: hasil = tampilBeranda();
    }
    document.getElementById("isi-halaman").innerHTML = hasil.html;
    document.title = hasil.judul;
    gambarMenu(hasil.menu);
    document.getElementById("kolom-cari").value = hasil.kueri || "";
    window.scrollTo(0, 0);
    if (!pertama) document.getElementById("utama").focus({ preventScroll: true });
    pertama = false;
  }

  document.getElementById("lewati").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("utama").focus();
  });
  document.getElementById("form-cari").addEventListener("submit", function (e) {
    e.preventDefault();
    var kolom = document.getElementById("kolom-cari");
    var q = kolom.value.trim();
    if (!q) { kolom.focus(); return; }
    var tujuan = "#/cari/" + encodeURIComponent(q);
    if (location.hash === tujuan) rute(); else location.hash = tujuan;
  });

  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (!f.classList || !f.classList.contains("langganan-form")) return;
    var status = f.parentNode.querySelector(".langganan-status");
    if (!LANGGANAN_URL) {
      e.preventDefault();
      /* Pesan ini tampil selama LANGGANAN_URL belum diisi. */
      status.textContent = "Langganan surel belum dibuka. Silakan kembali lagi nanti.";
    } else {
      status.textContent = "Terima kasih. Cek surelmu untuk konfirmasi langganan.";
    }
  });

  window.addEventListener("hashchange", rute);
  rute();
  muatDariFirebase();
})();
</script>
