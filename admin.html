<style>

  dialog h2 { font-family: var(--font-judul); font-weight: 400; font-size: 1.7rem; line-height: 1.15; }

    .tombol-form .tbl-bahaya { margin-left: 0; }

const hariIni = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};
const tglIndo = iso => {
  try { return new Date(iso + "T00:00:00Z").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }); }
  catch { return iso; }
};
const slugify = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/&/g, " dan ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80).replace(/-+$/, "");
const SLUG_VALID = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
/* Satu baris kosong memisahkan paragraf. Baris tunggal di dalam paragraf jadi spasi. */
const keParagraf = t => t.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
const jumlahKata = arr => arr.join(" ").split(/\s+/).filter(Boolean).length;
const menitBaca = arr => Math.max(1, Math.round(jumlahKata(arr) / 200));
const potong = (t, n) => {
  if (t.length <= n) return t;
  const p = t.slice(0, n), i = p.lastIndexOf(" ");
  return (i > n * 0.6 ? p.slice(0, i) : p).replace(/[\s,.;:]+$/, "") + "…";
};

  window.scrollTo(0, 0);

  if (bagian === "statistik") return statistik();
  if (bagian === "profil") return profil();

      <button class="tbl tbl-kecil" type="button" data-aksi="status">${terbit ? "Jadikan draf" : "Terbitkan"}</button>
      <button class="tbl tbl-kecil tbl-bahaya" type="button" data-aksi="hapus">Hapus</button>
    </div></li>`;
}

function isiDaftar() {
  const kunci = filter.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hasil = semua.filter(a => {
    if (filter.status && a.status !== filter.status) return false;
    if (filter.kat && a.kategori !== filter.kat) return false;
    if (!kunci.length) return true;
    const teks = (a.judul + " " + a.ringkas + " " + a.isi.join(" ")).toLowerCase();
    return kunci.every(k => teks.includes(k));
  });
  $("#hasil").innerHTML = hasil.length
    ? hasil.map(barisTulisan).join("")
    : '<li class="hasil-kosong">Tidak ada tulisan yang cocok dengan pencarian atau filter ini.</li>';
}

async function ubahStatus(a, btn) {
  const baru = a.status === "terbit" ? "draf" : "terbit";
  if (baru === "terbit" && !a.isi.length) {
    toast("Tulisan yang masih kosong belum bisa diterbitkan. Isi dulu di editor.", "galat");

    daftarTulisan();
  } catch (e) {
    console.error(e);
    toast(pesanFs(e), "galat");
    btn.disabled = false;
  }
}

async function hapusTulisan(a) {
  const ya = await konfirmasi("Hapus tulisan ini?", `"${a.judul || a.slug}" akan dihapus permanen dan tidak bisa dikembalikan.`, "Hapus");
  if (!ya) return;

function eksporCadangan() {
  const isi = {
    situs: "Hanya Catatan Kecil",
    diekspor: new Date().toISOString(),
    jumlah: semua.length,
    tulisan: semua.map(a => ({
      slug: a.slug, judul: a.judul, kategori: a.kategori, tanggal: a.tanggal,
      ringkas: a.ringkas, isi: a.isi, status: a.status
    }))
  };
  const blob = new Blob([JSON.stringify(isi, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const t = new Date(), p = n => String(n).padStart(2, "0");
  const nama = `cadangan-hck-${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}.json`;
  const a = document.createElement("a");
  a.href = url; a.download = nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Cadangan ${semua.length} tulisan diunduh.`);
}

function cadanganValid(x) {
  return x && Array.isArray(x.tulisan) && x.tulisan.length > 0 && x.tulisan.every(t =>
    t && typeof t.slug === "string" && SLUG_VALID.test(t.slug)
    && typeof t.judul === "string" && Array.isArray(t.isi)
    && (t.status === "terbit" || t.status === "draf"));
}

async function pulihkanCadangan(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    toast("Berkas ini bukan cadangan JSON yang valid.", "galat");
    return;
  }
  if (!cadanganValid(data)) {
    toast("Isi berkas tidak cocok dengan format cadangan HCK.", "galat");
    return;
  }
  const daftar = data.tulisan;
  const ya = await konfirmasi(
    `Pulihkan ${daftar.length} tulisan?`,
    "Tulisan dengan slug yang sama akan ditimpa oleh isi cadangan. Tulisan lain yang sudah ada di database tidak akan dihapus atau berubah.",
    "Pulihkan");
  if (!ya) return;
  try {
    for (let i = 0; i < daftar.length; i += 400) {
      const potongan = daftar.slice(i, i + 400);
      const batch = F.writeBatch(db);
      potongan.forEach(t => {
        batch.set(F.doc(db, "artikel", t.slug), {
          judul: t.judul, kategori: t.kategori || KATEGORI[0].id, tanggal: t.tanggal || hariIni(),
          ringkas: t.ringkas || "", isi: t.isi, status: t.status,
          dibuat: F.serverTimestamp(), diperbarui: F.serverTimestamp()
        }, { merge: true });
      });
      await batch.commit();
    }
    await muatSemua();
    toast(`${daftar.length} tulisan dipulihkan.`);
    daftarTulisan();
  } catch (e) {
    console.error(e);
    toast(pesanFs(e), "galat");
  }
}

async function imporContoh() {
  const tombol = $("#impor");
  tombol.disabled = true; tombol.textContent = "Mengimpor…";
  try {
    const batch = F.writeBatch(db);
    CONTOH.forEach(a => {
      batch.set(F.doc(db, "artikel", a.slug), { ...a, status: "terbit", dibuat: F.serverTimestamp(), diperbarui: F.serverTimestamp() });
    });

    await muatSemua();

    tombol.disabled = false; tombol.textContent = `Impor ${CONTOH.length} tulisan contoh`;
  }
}

/* ---------- Statistik ---------- */
const BATAS_HARI = 366;
const tambahHari = (iso, n) => new Date(new Date(iso + "T00:00:00Z").getTime() + n * 86400000).toISOString().slice(0, 10);
const selisihHari = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);

async function ambilStatistik(dari, sampai) {
  const snap = await F.getDocs(F.query(F.collection(db, "statistik"),
    F.where("tanggal", ">=", dari), F.where("tanggal", "<=", sampai)));
  const perHari = new Map(), perArtikel = new Map();
  snap.docs.forEach(dok => {
    const x = dok.data();
    if (x.slug) {
      const a = perArtikel.get(x.slug) || { slug: x.slug, tampilan: 0, klik: 0 };
      a.tampilan += x.tampilan || 0; a.klik += x.klik || 0;
      perArtikel.set(x.slug, a);
    } else {
      perHari.set(x.tanggal, x);
    }
  });
  const hh = [], jumlah = selisihHari(dari, sampai);
  for (let i = 0; i <= jumlah; i++) {
    const t = tambahHari(dari, i), x = perHari.get(t) || {};
    hh.push({ tanggal: t, pengunjung: x.pengunjung || 0, kunjungan: x.kunjungan || 0, tampilan: x.tampilan || 0, klik: x.klik || 0 });
  }
  return { hh, artikel: [...perArtikel.values()] };
}

function grafik(hh) {
  const W = 680, H = 240, kiri = 42, kanan = 12, atas = 12, bawah = 28;
  const maks = Math.max(1, ...hh.map(h => Math.max(h.pengunjung, h.klik)));
  const dasar = Math.pow(10, Math.floor(Math.log10(maks)));
  const puncak = [1, 2, 5, 10].map(m => m * dasar).find(v => v >= maks) || maks;
  const n = hh.length, lebar = W - kiri - kanan, tinggi = H - atas - bawah;
  const x = i => kiri + (n === 1 ? lebar / 2 : (i * lebar) / (n - 1));
  const y = v => atas + tinggi - (v / puncak) * tinggi;
  const jalur = k => hh.map((h, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(h[k]).toFixed(1)).join(" ");
  const label = t => tglPendek(t) + (hh[0].tanggal.slice(0, 4) !== hh[n - 1].tanggal.slice(0, 4) ? " " + t.slice(0, 4) : "");
  const kisi = [0, 0.5, 1].map(f => {
    const v = Math.round(puncak * f), yy = y(v).toFixed(1);
    return `<line class="kisi" x1="${kiri}" x2="${W - kanan}" y1="${yy}" y2="${yy}"/><text x="${kiri - 8}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${angka(v)}</text>`;
  }).join("");
  const idx = n === 1 ? [0] : [0, Math.floor((n - 1) / 2), n - 1];
  const sumbuX = idx.map((i, k) =>
    `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${n === 1 ? "middle" : k === 0 ? "start" : k === idx.length - 1 ? "end" : "middle"}">${esc(label(hh[i].tanggal))}</text>`).join("");
  const titik = n <= 31 ? hh.map((h, i) =>
    `<circle class="titik-pengunjung" cx="${x(i).toFixed(1)}" cy="${y(h.pengunjung).toFixed(1)}" r="3"><title>${esc(tglPendek(h.tanggal))}: ${angka(h.pengunjung)} pengunjung</title></circle>` +
    `<circle class="titik-klik" cx="${x(i).toFixed(1)}" cy="${y(h.klik).toFixed(1)}" r="3"><title>${esc(tglPendek(h.tanggal))}: ${angka(h.klik)} klik</title></circle>`).join("") : "";
  return `<svg class="grafik" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pengunjung dan klik per hari. Rinciannya ada di tabel di bawah.">
    ${kisi}${sumbuX}
    <path class="garis-pengunjung" d="${jalur("pengunjung")}"/>
    <path class="garis-klik" d="${jalur("klik")}"/>${titik}</svg>`;
}

function tampilStatistik({ hh, artikel }) {
  const jml = k => hh.reduce((s, h) => s + h[k], 0);
  const judulDari = slug => (semua.find(a => a.slug === slug) || {}).judul || slug;
  const kpi = [
    ["pengunjung", "Pengunjung", "Peramban unik, dihitung sekali per hari"],
    ["kunjungan", "Kunjungan", "Berapa kali situs dibuka dalam satu sesi"],
    ["tampilan", "Halaman dilihat", "Semua halaman yang dibuka"],
    ["klik", "Klik tulisan", "Klik pada judul atau Baca Selengkapnya"]
  ].map(([k, nama, ket]) => `<div><strong>${angka(jml(k))}</strong><span class="nama">${nama}</span><small>${ket}</small></div>`).join("");

  const kosong = ["pengunjung", "kunjungan", "tampilan", "klik"].every(k => jml(k) === 0);
  const populer = artikel.slice().sort((a, b) => b.tampilan - a.tampilan || b.klik - a.klik).slice(0, 10);

  return `<div class="kpi">${kpi}</div>
    <section class="bagian-stat" aria-labelledby="h-grafik">
      <h2 id="h-grafik">Pengunjung dan klik per hari</h2>
      ${kosong ? '<p class="hasil-kosong">Belum ada data pada rentang ini. Angka mulai terhitung saat situs dibuka dengan Firebase aktif.</p>' : `
      <div class="legenda">
        <span><svg width="28" height="8" aria-hidden="true"><line x1="0" y1="4" x2="28" y2="4" class="garis-pengunjung"/></svg>Pengunjung</span>
        <span><svg width="28" height="8" aria-hidden="true"><line x1="0" y1="4" x2="28" y2="4" class="garis-klik"/></svg>Klik tulisan</span>
      </div>${grafik(hh)}`}
    </section>
    <section class="bagian-stat" aria-labelledby="h-populer">
      <h2 id="h-populer">Tulisan paling banyak dibaca</h2>
      ${populer.length ? `<div class="tabel-bungkus"><table class="tabel">
        <thead><tr><th scope="col">Tulisan</th><th scope="col" class="angka">Dibaca</th><th scope="col" class="angka">Klik</th></tr></thead>
        <tbody>${populer.map(a => `<tr><td>${esc(judulDari(a.slug))}</td><td class="angka">${angka(a.tampilan)}</td><td class="angka">${angka(a.klik)}</td></tr>`).join("")}</tbody>
      </table></div>` : '<p class="hasil-kosong">Belum ada tulisan yang dibaca pada rentang ini.</p>'}
    </section>
    <details class="rincian">
      <summary>Rincian per hari</summary>
      <div class="tabel-bungkus"><table class="tabel">
        <thead><tr><th scope="col">Tanggal</th><th scope="col" class="angka">Pengunjung</th><th scope="col" class="angka">Kunjungan</th><th scope="col" class="angka">Dilihat</th><th scope="col" class="angka">Klik</th></tr></thead>
        <tbody>${hh.slice().reverse().map(h => `<tr><td>${esc(tglIndo(h.tanggal))}</td><td class="angka">${angka(h.pengunjung)}</td><td class="angka">${angka(h.kunjungan)}</td><td class="angka">${angka(h.tampilan)}</td><td class="angka">${angka(h.klik)}</td></tr>`).join("")}</tbody>
      </table></div>
    </details>`;
}

async function statistik() {
  kotor = false;
  document.title = "Statistik | Admin HCK";
  const hariIniWIB = hariWIB(0);
  if (periode.preset) { periode.sampai = hariIniWIB; periode.dari = hariWIB(periode.preset - 1); }
  let abaikan = false;
  try { abaikan = localStorage.getItem("hck-abaikan") === "1"; } catch {}

  $("#isi").innerHTML = `
    <div class="kepala-halaman"><h1>Statistik</h1></div>
    <div class="filter-stat">
      <div class="rentang" role="group" aria-label="Rentang cepat">
        ${[7, 30, 90].map(n => `<button type="button" class="tbl tbl-kecil" data-hari="${n}" aria-pressed="${periode.preset === n}">${n} hari terakhir</button>`).join("")}
      </div>
      <form class="tanggal-form" id="f-tanggal" novalidate>

    <div id="stat-isi"><p class="tengah">Memuat statistik…</p></div>
    <label class="cek"><input type="checkbox" id="abaikan">
      <span>Jangan hitung kunjungan dari peramban ini
        <small>Centang agar kunjungan Anda sendiri saat menguji situs tidak ikut terhitung. Berlaku bila panel admin dan situs dibuka dari alamat yang sama. Hari dihitung menurut WIB.</small></span></label>`;

  $("#t-dari").value = periode.dari;
  $("#t-sampai").value = periode.sampai;
  $("#ket-periode").textContent = `Menampilkan ${tglIndo(periode.dari)} sampai ${tglIndo(periode.sampai)} (${selisihHari(periode.dari, periode.sampai) + 1} hari)`;

  document.querySelectorAll("[data-hari]").forEach(b => {
    b.onclick = () => { periode.preset = Number(b.dataset.hari); statistik(); };

    e.preventDefault();

    if (dari > sampai) { galat.textContent = "Tanggal awal tidak boleh setelah tanggal akhir."; return; }
    if (sampai > hariIniWIB) { galat.textContent = "Tanggal akhir tidak boleh melewati hari ini."; return; }
    if (selisihHari(dari, sampai) + 1 > BATAS_HARI) { galat.textContent = `Rentang paling lama ${BATAS_HARI} hari.`; return; }
    periode.preset = null; periode.dari = dari; periode.sampai = sampai;
    statistik();
  };

  $("#abaikan").checked = abaikan;
  $("#abaikan").onchange = e => {
    try {
      if (e.target.checked) localStorage.setItem("hck-abaikan", "1"); else localStorage.removeItem("hck-abaikan");

    } catch {
      e.target.checked = false;
      toast("Peramban ini tidak mengizinkan menyimpan pengaturan.", "galat");
    }
  };

  const token = ++tokenStat;
  try {

  } catch (e) {
    console.error(e);
    if (token !== tokenStat || !$("#stat-isi")) return;
    $("#stat-isi").innerHTML = kartuGalat("Statistik gagal dimuat",
      `<p>${e.code === "permission-denied"
        ? "Aturan Firestore belum mengizinkan admin membaca statistik. Salin aturan terbaru dari <code>firestore.rules</code>, lalu klik Publish di tab Rules Firebase."
        : esc(pesanFs(e))}</p>`,
      '<button class="tbl" id="stat-ulang" type="button">Coba lagi</button>');
    $("#stat-ulang").onclick = statistik;
  }
}

/* ---------- Profil ---------- */
function kekuatanSandi(s) {
  if (!s) return 0;
  let skor = 0;
  if (s.length >= 8) skor++;
  if (s.length >= 12) skor++;
  if (/[a-z]/.test(s) && /[A-Z]/.test(s)) skor++;
  if (/[0-9]/.test(s)) skor++;
  if (/[^A-Za-z0-9]/.test(s)) skor++;
  return Math.min(3, Math.ceil(skor / 1.6));
}

    <div class="isi">${jml}</div></article>`;
}

function editor(a) {
  const baru = !a;
  let slugSaatIni = a ? a.slug : "";
  let slugManual = !baru;   /* pada tulisan lama, slug tidak berubah otomatis saat judul diedit */
  kotor = false;
  document.title = (baru ? "Tulisan baru" : "Edit tulisan") + " | Admin HCK";

  const d = a
    ? { ...a, isiTeks: a.isi.join("\n\n") }
    : { slug: "", judul: "", kategori: KATEGORI[0].id, tanggal: hariIni(), ringkas: "", isiTeks: "", status: "draf" };

  $("#isi").innerHTML = `
    <div class="kepala-halaman"><h1>${baru ? "Tulisan baru" : "Edit tulisan"}</h1><a class="tbl" href="#/">Kembali ke daftar</a></div>
    <div class="tab" role="tablist">
      <button type="button" role="tab" id="tab-tulis" aria-selected="true" aria-controls="p-tulis">Tulis</button>
      <button type="button" role="tab" id="tab-lihat" aria-selected="false" aria-controls="p-lihat">Pratinjau</button>
    </div>
    <form id="form" novalidate>
      <div id="p-tulis" role="tabpanel" aria-labelledby="tab-tulis">
        <label class="medan"><span class="label">Judul</span>
          <input type="text" id="f-judul" maxlength="150" autocomplete="off" required></label>
        <label class="medan"><span class="label">Slug (alamat tulisan)</span>
          <input type="text" id="f-slug" maxlength="80" autocomplete="off" spellcheck="false">
          <small>Huruf kecil, angka, dan tanda hubung. Alamatnya: <code>index.html#/artikel/<span id="slug-contoh"></span></code>${baru ? "" : " Mengubah slug akan mengubah tautan tulisan ini."}</small></label>
        <div class="baris3">
          <label class="medan"><span class="label">Kategori</span>
            <select id="f-kat">${KATEGORI.map(k => `<option value="${k.id}">${esc(k.nama)}</option>`).join("")}</select></label>
          <label class="medan"><span class="label">Tanggal terbit</span>
            <input type="date" id="f-tgl" required></label>
          <label class="medan"><span class="label">Status</span>
            <select id="f-status"><option value="draf">Draf (belum tampil di situs)</option><option value="terbit">Terbit</option></select></label>
        </div>
        <label class="medan"><span class="label">Ringkasan</span>
          <textarea id="f-ringkas" rows="3" maxlength="300"></textarea>
          <small><span id="c-ringkas">0</span> dari 300 huruf. Tampil di daftar tulisan. Kosongkan agar diambil dari paragraf pertama.</small></label>
        <label class="medan"><span class="label">Isi tulisan</span>
          <textarea id="f-isi" rows="18"></textarea>
          <small>Pisahkan paragraf dengan satu baris kosong. <span id="statistik"></span></small></label>
      </div>
      <div id="p-lihat" role="tabpanel" aria-labelledby="tab-lihat" hidden></div>
      <p class="galat" id="galat" role="alert"></p>
      <div class="tombol-form">
        <button class="tbl tbl-utama" type="submit" id="simpan">Simpan</button>
        ${baru ? "" : '<button class="tbl tbl-bahaya" type="button" id="hapus-ini">Hapus tulisan</button>'}
      </div>
    </form>`;

  /* Isi nilai lewat properti agar aman dari karakter khusus */
  $("#f-judul").value = d.judul;
  $("#f-slug").value = d.slug;
  $("#f-kat").value = KATEGORI.some(k => k.id === d.kategori) ? d.kategori : KATEGORI[0].id;
  $("#f-tgl").value = d.tanggal;
  $("#f-status").value = d.status;
  $("#f-ringkas").value = d.ringkas;
  $("#f-isi").value = d.isiTeks;

  const kumpul = () => {
    const paras = keParagraf($("#f-isi").value);
    let ringkas = $("#f-ringkas").value.trim();
    if (!ringkas && paras[0]) ringkas = potong(paras[0], 180);
    return {
      slug: $("#f-slug").value.trim(), judul: $("#f-judul").value.trim(), kategori: $("#f-kat").value,
      tanggal: $("#f-tgl").value, ringkas, isi: paras, status: $("#f-status").value
    };
  };
  const perbarui = () => {
    const paras = keParagraf($("#f-isi").value);
    $("#statistik").textContent = paras.length
      ? `${jumlahKata(paras)} kata, ${paras.length} paragraf, sekitar ${menitBaca(paras)} menit baca.`
      : "Belum ada isi.";
    $("#c-ringkas").textContent = $("#f-ringkas").value.length;
    $("#slug-contoh").textContent = $("#f-slug").value.trim() || "slug-tulisan";
  };
  perbarui();

  $("#form").addEventListener("input", e => {
    kotor = true;
    $("#galat").textContent = "";
    if (e.target.id === "f-slug") {
      $("#f-slug").value = $("#f-slug").value.toLowerCase().replace(/\s+/g, "-");
      slugManual = $("#f-slug").value.trim() !== "";
    } else if (e.target.id === "f-judul" && !slugManual) {
      $("#f-slug").value = slugify($("#f-judul").value);
    }
    perbarui();
  });

  /* Tab tulis dan pratinjau */
  const pilihTab = lihat => {
    $("#p-tulis").hidden = lihat; $("#p-lihat").hidden = !lihat;
    $("#tab-tulis").setAttribute("aria-selected", String(!lihat));
    $("#tab-lihat").setAttribute("aria-selected", String(lihat));
    if (lihat) $("#p-lihat").innerHTML = pratinjau(kumpul());
  };
  $("#tab-tulis").onclick = () => pilihTab(false);
  $("#tab-lihat").onclick = () => pilihTab(true);

  const cek = data => {
    if (!data.judul) return ["Judul belum diisi.", "#f-judul"];
    if (!data.slug) return ["Slug belum diisi.", "#f-slug"];
    if (!SLUG_VALID.test(data.slug)) return ["Slug hanya boleh berisi huruf kecil, angka, dan tanda hubung, tanpa spasi.", "#f-slug"];
    if (!data.tanggal) return ["Tanggal belum diisi.", "#f-tgl"];
    if (data.status === "terbit" && !data.isi.length) return ["Tulisan yang diterbitkan harus punya isi. Isi dulu, atau simpan sebagai draf.", "#f-isi"];
    return null;
  };

  $("#form").onsubmit = async e => {
    e.preventDefault();
    pilihTab(false);
    const data = kumpul();
    const masalah = cek(data);
    if (masalah) { $("#galat").textContent = masalah[0]; $(masalah[1]).focus(); return; }
    const tombol = $("#simpan");
    tombol.disabled = true; tombol.textContent = "Menyimpan…";
    try {
      await simpan(data, slugSaatIni);
      kotor = false;
      toast("Tersimpan.");
      /* Editor ditutup: kembali ke daftar, tempat tulisan yang baru disimpan langsung terlihat */
      location.hash = "#/";
    } catch (err) {
      console.error(err);
      $("#galat").textContent = pesanFs(err);
      tombol.disabled = false; tombol.textContent = "Simpan";
    }
  };

  function pasangHapus() {
    const b = $("#hapus-ini");
    if (!b) return;
    b.onclick = async () => {
      const judul = $("#f-judul").value.trim() || slugSaatIni;
      if (!(await konfirmasi("Hapus tulisan ini?", `"${judul}" akan dihapus permanen dan tidak bisa dikembalikan.`, "Hapus"))) return;
      try {
        await F.deleteDoc(F.doc(db, "artikel", slugSaatIni));
        semua = semua.filter(x => x.slug !== slugSaatIni);
        kotor = false;
        toast("Dihapus.");
        location.hash = "#/";
      } catch (err) {
        console.error(err);
        toast(pesanFs(err), "galat");
      }
    };
  }
  pasangHapus();
  if (baru) $("#f-judul").focus();
}

async function simpan(data, slugLama) {
  const ref = F.doc(db, "artikel", data.slug);
  const lama = slugLama ? semua.find(x => x.slug === slugLama) : null;

  if (data.slug !== slugLama) {
    const ada = await F.getDoc(ref);
    if (ada.exists()) throw Object.assign(new Error("slug dipakai"), { code: "slug-dipakai" });
  }

  if (!slugLama) {
    await F.setDoc(ref, { ...data, dibuat: F.serverTimestamp(), diperbarui: F.serverTimestamp() });
  } else if (slugLama === data.slug) {
    await F.setDoc(ref, { ...data, diperbarui: F.serverTimestamp() }, { merge: true });
  } else {
    /* Slug berubah: dokumen dipindah ke ID baru dalam satu langkah */
    const batch = F.writeBatch(db);
    batch.set(ref, { ...data, dibuat: (lama && lama.dibuat) || F.serverTimestamp(), diperbarui: F.serverTimestamp() });
    batch.delete(F.doc(db, "artikel", slugLama));
    await batch.commit();
  }

  semua = semua.filter(x => x.slug !== slugLama && x.slug !== data.slug);
  semua.push({ ...(lama || {}), ...data });
  urut();
}

/* ---------- Mulai ---------- */
(async function mulai() {
  if (!cfg || !cfg.apiKey || !cfg.projectId) { tampilSetup(); return; }
  try {
    const [A, Auth, Fs] = await Promise.all([
      import(V + "firebase-app.js"),
      import(V + "firebase-auth.js"),
      import(V + "firebase-firestore.js")
    ]);
    Au = Auth; F = Fs;
    const app = A.initializeApp(cfg);
    auth = Au.getAuth(app);
    db = F.getFirestore(app);
  } catch (e) {
    console.error(e);
    root.innerHTML = `<main class="masuk">${kartuGalat("Firebase gagal dimuat",
      "<p>Periksa koneksi internet. Jika halaman dibuka langsung dari berkas (file://), jalankan lewat server lokal atau Firebase Hosting.</p>",
      '<button class="tbl" type="button" onclick="location.reload()">Muat ulang</button>')}</main>`;
    return;
  }
  Au.onAuthStateChanged(auth, async user => {
    pengguna = user;
    if (user) { await masukKeAdmin(); }
    else { semua = []; kotor = false; tampilMasuk(); }
  });
})();
</script>
